# Multiconfig for vruntime aarch64 rootfs images
# Used to build minimal container-runtime-capable rootfs for QEMU environment
# Supports vdkr (Docker) and vpdmn (Podman) virtual container runtimes

MACHINE = "qemuarm64"

# Minimal distro features - no graphics, no networking extras
DISTRO_FEATURES:remove = "x11 wayland pulseaudio bluetooth wifi nfc 3g pcmcia"

# Enable squashfs + overlayfs support in kernel
KERNEL_FEATURES:append = " cfg/fs/squashfs.cfg features/overlayfs/overlayfs.cfg"

# Default to ext4, but rootfs recipes may override to squashfs
IMAGE_FSTYPES = "ext4"

# Use a separate TMPDIR to avoid conflicts with main build
# This keeps vruntime build artifacts separate
TMPDIR = "${TOPDIR}/tmp-vruntime-aarch64"
